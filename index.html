<!DOCTYPE html>
<html>
<head>
  <title>Untuk Kamu</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      font-family: sans-serif;
      background: url('foto.jpg') center/cover;
    }

    .box {
      background: rgba(255, 255, 255, 0.08); /* tipis banget, kayak kaca */
      backdrop-filter: blur(6px);            /* blur ringan */
      -webkit-backdrop-filter: blur(6px);

      padding: 25px;
      border-radius: 18px;
      width: 85%;
      max-width: 500px;

      border: 1px solid rgba(255,255,255,0.25);

      position: relative;
      overflow: hidden;

      /* ✨ glow halus */
      box-shadow: 
        0 8px 32px rgba(0,0,0,0.4),
        0 0 15px rgba(255,255,255,0.15);

      /* 🎬 animasi masuk */
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1.5s ease forwards;
    }

    #text {
      font-size: 24px;
      line-height: 1.7;
      min-height: 120px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    h2 {
      font-size: 30px;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    button {
      margin-top: 25px;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 25px;
    }

    @media (max-width: 600px) {
      #text {
        font-size: 24px;
      }

      h2 {
        font-size: 28px;
      }
    
      .box {
        width: 90%;
        padding: 20px;
      }
    }

    .box::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,0.25),
        rgba(255,255,255,0.05)
      );
      pointer-events: none;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<div class="box">
  <h2>aku minta maaf...</h2>
  <p id="text"></p>
  <button id="btn">klik pelan ya...</button>
</div>

<audio id="musik" loop playsinline>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<script>
  const btn = document.getElementById("btn");
  const audio = document.getElementById("musik");
  const text = document.getElementById("text");

  const texts = [
    "sayang...",
    "aku cuma mau kamu tau sesuatu dari hati aku...",
    "aku masih di sini, masih sama kamu...",
    "perasaan aku ke kamu ga berubah...",
    "aku masih sayang kamu, dan mungkin akan selalu begitu...",
    "aku kangen kita yang dulu, yang sederhana tapi hangat...",
    "aku kangen ngobrol sama kamu tanpa mikir apa-apa...",
    "aku kangen denger suara kamu...",
    "dan aku kangen kamu yang selalu ada di hari-hari aku...",
    "kadang aku mikir, dari semua hal di hidup aku...",
    "kamu itu yang paling aku jaga di hati...",
    "bukan karena sempurna...",
    "tapi karena kamu itu kamu...",
    "dan itu selalu cukup buat aku...",
    "aku ga butuh yang lain...",
    "aku cuma butuh kamu tetap di sini...",
    "nemenin aku pelan-pelan...",
    "jalanin semuanya tanpa harus buru-buru...",
    "aku ga akan maksa kamu...",
    "aku cuma berharap kamu masih ngerasain hal yang sama...",
    "karena di sini...",
    "aku masih milih kamu...",
    "hari ini, besok, dan seterusnya...",
    "akuu sayangggggg samaa kamuuuuu...",
    "akuu cintaaaa samaa kamuuuuu...",
    "i love youuu sayangggggg...",
  ];

  let i = 0;
  let started = false;

  btn.addEventListener("click", function () {

    // 🔊 mulai musik (fix untuk GitHub + HP)
    if (!started) {
      audio.volume = 0.5;
      audio.play().catch(err => {
        alert("Audio gagal: " + err);
      });
      started = true;
    }

    // 📝 tampilkan teks
    text.innerText = texts[i];
    i++;
    if (i >= texts.length) i = texts.length - 1;
  });
</script>

</body>
</html>
